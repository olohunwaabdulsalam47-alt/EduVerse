<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduVerse - Attendance Check</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;width:100%;max-width:420px;border-radius:24px;padding:32px;border:1px solid #334155}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:28px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px 16px;display:flex;gap:10px;margin-bottom:20px;font-size:13px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%}
label{font-size:13px;color:#cbd5e1;margin-bottom:6px;display:block;font-weight:600}
input,select{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:14px 16px;border-radius:12px;margin-bottom:16px;font-size:15px}
.btn{width:100%;background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;color:#fff;padding:16px;border-radius:12px;font-weight:700;font-size:16px}
.success{display:none;text-align:center;padding:40px 0}
.success .check{width:72px;height:72px;background:#22c55e20;border:2px solid #22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px}
.loader{display:none;text-align:center;padding:20px}
.spinner{width:32px;height:32px;border:3px solid #334155;border-top:3px solid #38bdf8;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><h1>EduVerse</h1><p>Attendance Verification</p></div>
  <div id="formView">
    <div class="status"><div class="dot"></div><span id="liveTime"></span><span style="margin-left:auto" id="locationStatus">📍 Locating...</span></div>
    <label>Student ID</label><input id="studentId" placeholder="EDU/2024/001">
    <label>Full Name</label><input id="fullName" placeholder="Abdul Salam">
    <label>Course</label><select id="course"><option value="">Select</option><option>Computer Science 101</option><option>Mathematics</option><option>Physics</option><option>EduVerse General</option></select>
    <button class="btn" onclick="checkAttendance()">Mark Attendance →</button>
  </div>
  <div id="loaderView" class="loader"><div class="spinner"></div><p>Verifying...</p></div>
  <div id="successView" class="success"><div class="check">✓</div><h2>Attendance Marked!</h2><p id="successText" style="color:#94a3b8;font-size:14px"></p><p style="color:#38bdf8;font-size:13px">Redirecting in <span id="countdown">3</span>s...</p></div>
</div>
<script>
let coords=null; setInterval(()=>{document.getElementById('liveTime').textContent=new Date().toLocaleString()},1000);
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{coords=p.coords.latitude+','+p.coords.longitude;document.getElementById('locationStatus').textContent='📍 Verified'},()=>{document.getElementById('locationStatus').textContent='📍 Denied'})}
function checkAttendance(){
  const id=document.getElementById('studentId').value, name=document.getElementById('fullName').value, course=document.getElementById('course').value;
  if(!id||!name||!course){alert('Fill all fields');return;}
  document.getElementById('formView').style.display='none';document.getElementById('loaderView').style.display='block';
  localStorage.setItem('eduverse_attendance',JSON.stringify({id,name,course,time:new Date().toISOString(),coords}));
  setTimeout(()=>{
    document.getElementById('loaderView').style.display='none';document.getElementById('successView').style.display='block';
    document.getElementById('successText').textContent=`Welcome ${name} (${id})`;
    let c=3; setInterval(()=>{c--;document.getElementById('countdown').textContent=c; if(c<=0){window.location.href='dashboard.html'}},1000);
  },1500);
}
</script>
</body>
  </html>
