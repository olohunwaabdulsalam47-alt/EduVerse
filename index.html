<script>
// ULTRA FIX - No more undefined ever
let raw = localStorage.getItem('ultra_current_school');

try { school = raw ? JSON.parse(raw) : null; } catch(e){ school = null; }
let name = school ? (school.schoolName || school.name || school.school_name) : null;
if(school && name){
  location.href='dashboard.html';
} else {
  location.href='landing.html';
}
</script>
