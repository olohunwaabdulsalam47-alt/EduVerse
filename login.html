<input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button id="btn">Login</button>
<script>
document.getElementById('btn').onclick=()=>{
 let all = JSON.parse(localStorage.getItem('ultra_all_schools')||'[]');
 let f = all.find(x=>x.email==document.getElementById('email').value);
 if(f){ localStorage.setItem('ultra_current_school', JSON.stringify(f)); location.href='dashboard.html'; } else { alert('Not found, register'); }
}
</script>
