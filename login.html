<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduVerse - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif}
.card{background:#1e293b;width:90%;max-width:380px;padding:24px;border-radius:16px}
.btn{width:100%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0;padding:12px;border-radius:8px;margin-top:10px;font-weight:bold}
input{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:10px;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<div class="card">
<h1 style="text-align:center;margin-bottom:20px">EduVerse</h1>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" id="emailLogin">Login with Email</button>
<button class="btn" id="googleLogin" style="background:#fff;color:#000">Login with Google</button>
<p id="msg" style="text-align:center;margin-top:12px;font-size:13px"></p>
</div>

<script type="module">
import { auth, googleProvider, db } from './src/firebase.js';
import { signInWithEmailAndPassword, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.getElementById('googleLogin').onclick = async () => {
  try{
    const result = await signInWithPopup(auth, googleProvider);
    await setDoc(doc(db, "users", result.user.uid), {
      name: result.user.displayName,
      email: result.user.email,
      lastLogin: new Date()
    }, {merge:true});
    window.location.href = 'index.html';
  }catch(e){ document.getElementById('msg').innerText = e.message }
};

document.getElementById('emailLogin').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try{
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = 'index.html';
  }catch(e){ document.getElementById('msg').innerText = e.message }
};
</script>
</body>
</html>
