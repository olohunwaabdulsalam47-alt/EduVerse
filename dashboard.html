<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - EduVerse</title>
<style>
body{font-family:Arial;background:#f5f7fb;margin:0;padding:16px}
.card{max-width:600px;margin:30px auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.1)}
h2{margin:0 0 10px}
.badge{background:#eef2ff;color:#4f46e5;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:12px}
.info{line-height:1.9;margin:15px 0}
button{padding:11px 18px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.logout{background:#ef4444;color:#fff}
.go{background:#4f46e5;color:#fff;margin-left:8px}
</style>
</head>
<body>
<div class="card" id="card"><h2>Loading...</h2><p>Checking login...</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY_HERE",
  authDomain: "eduverse-a1d66.firebaseapp.com",
  projectId: "eduverse-a1d66",
  storageBucket: "eduverse-a1d66.appspot.com",
  messagingSenderId: "YOUR_ID_HERE",
  appId: "YOUR_APP_ID_HERE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const card = document.getElementById('card');

onAuthStateChanged(auth, async (user)=>{
  if(!user){ location.href="login.html"; return; }
  try{
    const snap = await getDoc(doc(db,"students",user.uid));
    if(!snap.exists()){
      card.innerHTML=`<h2>No profile found</h2><p>${user.email}</p><button class="logout" id="lo">Logout</button>`;
      document.getElementById('lo').onclick=()=>signOut(auth).then(()=>location.href="login.html");
      return;
    }
    const s = snap.data();
    // FIXED BUG - NOW SHOWS NAME CORRECTLY
    const displayName = s.name || s.schoolName || s.fullName || s.studentName || "Student";

    card.innerHTML=`
      <h2>Welcome, ${displayName} 👋</h2>
      <span class="badge">Verified Student</span>
      <div class="info">
        <b>Name:</b> ${displayName}<br>
        <b>Email:</b> ${s.email || user.email}<br>
        <b>Phone:</b> ${s.phone || "N/A"}<br>
        <b>School:</b> ${s.schoolName || s.school || "N/A"}<br>
        <b>Expiry:</b> ${s.expiryDate || s.expiry || "Active"}<br>
        <b>UID:</b> ${user.uid}
      </div>
      <button class="logout" id="lo">Logout</button>
      <button class="go" id="go">Courses</button>
    `;
    document.getElementById('lo').onclick=()=>signOut(auth).then(()=>location.href="login.html");
    document.getElementById('go').onclick=()=>location.href="courses.html";
  }catch(e){
    card.innerHTML=`<h2>Error: ${e.message}</h2><button class="logout" id="lo">Logout</button>`;
    document.getElementById('lo').onclick=()=>signOut(auth).then(()=>location.href="login.html");
  }
});
</script>
</body>
</html>
