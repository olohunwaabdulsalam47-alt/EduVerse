<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduVerse - Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:sans-serif;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#1e293b;border-radius:12px;padding:16px;margin-top:16px}.btn{background:#6366f1;color:#fff;border:0;padding:10px 16px;border-radius:8px}
</style>
</head>
<body>
<div class="top">
<h2>EduVerse</h2>
<button class="btn" id="logout">Logout</button>
</div>
<div class="card">
<h3 id="welcome">Loading...</h3>
<p id="email" style="opacity:.7;font-size:13px;margin-top:4px"></p>
</div>
<div class="card">
<h4>Quick Actions</h4>
<button class="btn" onclick="location.href='index.html'" style="margin-top:10px;width:100%">Go to Attendance Check</button>
</div>

<script type="module">
import { auth } from './src/firebase.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if(!user){ window.location.href = 'login.html'; }
  else{
    document.getElementById('welcome').innerText = 'Welcome, ' + (user.displayName || 'Student');
    document.getElementById('email').innerText = user.email;
  }
});

document.getElementById('logout').onclick = async () => {
  await signOut(auth);
  window.location.href = 'login.html';
};
</script>
</body>
</html>
