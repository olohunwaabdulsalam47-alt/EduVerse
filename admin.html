<input id="adminPass" placeholder="Admin Pass"><button onclick="show()">Show Schools</button><div id="list"></div>
<script>
function show(){
 if(document.getElementById('adminPass').value!='09027398199') return alert('Wrong');
 let all = JSON.parse(localStorage.getItem('ultra_all_schools')||'[]');
 document.getElementById('list').innerHTML = all.map(s=>`<div>${s.schoolName} - ${s.email} - Exp: ${new Date(s.expiry).toLocaleDateString()} <button onclick="add30('${s.email}')">+30 days</button></div>`).join('');
}
function add30(email){
 let all = JSON.parse(localStorage.getItem('ultra_all_schools')||'[]');
 let i = all.findIndex(x=>x.email==email); all[i].expiry += 30*24*60*60*1000;
 localStorage.setItem('ultra_all_schools', JSON.stringify(all)); alert('Added'); show();
}
</script>
